name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage static site
        run: |
          set -e
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r assets data dist _site/
          cp README.md LICENSE NOTICE.md _site/
          mkdir -p _site/mods
          cp -r mods/manifests mods/common mods/extra mods/README.md _site/mods/
          ls -R _site | head -40

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
